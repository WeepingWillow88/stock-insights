name: Refresh market data

# Runs the full pipeline (re-downloads prices, recomputes metrics/screen/signals/macro/news),
# rebuilds the slim seed.db that ships to Streamlit Cloud, and pushes it. Pushing seed.db to the
# repo triggers a Streamlit Community Cloud redeploy, so the live app picks up fresh prices with
# no manual step.
#
# Schedule is in UTC (GitHub cron ignores DST). US market is 09:30–16:00 ET. We want two runs:
#   • pre-open   — morning, before the 09:30 ET open
#   • pre-close  — ~15 min before the 16:00 ET close
# ET is UTC-4 (summer/EDT) or UTC-5 (winter/EST), so each intent has one cron per season.
#
# GitHub's scheduled trigger is BEST-EFFORT: under load it delays runs by many minutes or drops
# them entirely, with no retry — so a single pre-close cron is unreliable (see the dropped
# 2026-08-26 afternoon run). We therefore fire SEVERAL staggered pre-close crons; the "gate" step
# below passes only the ones that land in the pre-/post-close window (the wrong season's crons land
# outside it and are skipped), and an idempotency check makes every attempt after the first a
# no-op — so we get redundancy against dropped/late deliveries without double refreshes.
on:
  schedule:
    # --- pre-open (morning; the gate accepts any pre-noon ET run, so one is plenty) ---
    - cron: "45 12 * * 1-5"    # ~08:45 ET (EDT) / 07:45 ET (EST) — before the open
    # --- pre-close, EDT/summer: 15:20 / 15:35 / 15:50 ET (staggered redundancy) ---
    - cron: "20,35,50 19 * * 1-5"
    # --- pre-close, EST/winter: 15:20 / 15:35 / 15:50 ET (staggered redundancy) ---
    - cron: "20,35,50 20 * * 1-5"
  workflow_dispatch:           # allow manual "Run workflow" from the Actions tab

# Never let two refreshes run at once (they both push seed.db).
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write              # needed to commit + push the refreshed seed.db

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 30       # enough history for the gate's "already refreshed today?" check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decide whether to run + label it (DST-aware, around the NYSE close)
        id: gate
        run: |
          python3 - <<'PY'
          import os, datetime, subprocess
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/New_York"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          run, kind = "yes", "manual"
          if event == "schedule":
              if now.hour < 12:                     # the morning cron
                  kind = "pre-open"
              else:                                  # an afternoon cron
                  close = now.replace(hour=16, minute=0, second=0, microsecond=0)
                  mins = (close - now).total_seconds() / 60   # +ve before close, -ve after
                  # Wide window so a delayed/early GitHub delivery still lands: 60 min before the
                  # close through 20 min after. The wrong season's crons fire far outside this and
                  # are skipped. Runs after the bell are still useful (final EOD prices).
                  if -20 <= mins <= 60:
                      kind = "pre-close" if mins >= 0 else "post-close"
                  else:
                      run = "no"
              # Idempotency: with several staggered pre-close crons, only the FIRST that lands should
              # do work. If today's afternoon refresh already committed seed.db, skip this attempt.
              # Boundary = 18:00 UTC today: well after the morning run (~13 UTC), before the
              # earliest afternoon cron (19:20 UTC), so only an afternoon refresh trips this.
              if run == "yes" and kind in ("pre-close", "post-close"):
                  since = now.astimezone(ZoneInfo("UTC")).replace(
                      hour=18, minute=0, second=0, microsecond=0).strftime("%Y-%m-%dT%H:%M:%S")
                  log = subprocess.run(
                      ["git", "log", "--since", since, "--pretty=%H", "--", "data/seed.db"],
                      capture_output=True, text=True).stdout.strip()
                  if log:
                      run, kind = "no", "already-refreshed"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={run}\nkind={kind}\n")
          print(f"event={event} ET={now:%Y-%m-%d %H:%M} -> run={run} kind={kind}")
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Run full pipeline (download prices + rebuild everything)
        if: steps.gate.outputs.run == 'yes'
        env:
          # Trading capital in £ (optional). Set repo variable CAPITAL_GBP to size the daily run
          # against a different budget; unset/blank falls back to the £50,000 default in config.py.
          CAPITAL_GBP: ${{ vars.CAPITAL_GBP }}
          # Optional: set this repo secret to score news with Claude; without it the pipeline
          # falls back to a keyword scan (FinBERT is not installed in CI to keep the run light).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}   # optional; real econ calendar (paid FMP plan)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}  # optional; richer stock news (free tier)
          # Alpha Vantage article-level news sentiment for the day's actionable names. Comma-separate
          # several free keys in the secret to rotate past the 25/day-per-key cap.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          RUN_KIND: ${{ steps.gate.outputs.kind }}  # 'pre-open' / 'pre-close' / 'manual' (shown in-app)
        run: python -m src.pipeline

      - name: Rebuild slim seed.db
        if: steps.gate.outputs.run == 'yes'
        run: python make_seed.py

      - name: Commit & push refreshed seed.db
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seed.db
          if git diff --cached --quiet; then
            echo "No change in seed.db — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled market-data refresh [skip ci]"
          # Rebase-and-retry push. If anything else pushed to main between checkout and now
          # (a code commit, an overlapping manual dispatch), a plain push is rejected as
          # non-fast-forward and the refresh is silently lost. seed.db is the only file we
          # touch, so rebasing onto the latest main is conflict-free.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest origin/main and retrying..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Failed to push refreshed seed.db after 5 attempts."
          exit 1

  # If the refresh above failed at any step, the app's data silently goes stale — nobody would
  # know without checking the "as of" timestamp. Open (or bump) a GitHub issue so a missed run
  # is visible. Skips cleanly on the gated no-op afternoon cron (that run succeeds).
  notify-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or bump a "refresh failed" issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠️ Scheduled data refresh failed"
          {
            echo "The twice-daily market-data refresh failed, so the live app's data may be stale"
            echo "until the next successful run. Check the failed run, then re-run it once fixed."
            echo
            echo "Failed run: $RUN_URL"
          } > /tmp/body.md
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Refresh failed again — $RUN_URL"
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi
