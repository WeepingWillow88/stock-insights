name: Refresh market data

# Runs the full pipeline (re-downloads prices, recomputes metrics/screen/signals/macro/news),
# rebuilds the slim seed.db that ships to Streamlit Cloud, and pushes it. Pushing seed.db to the
# repo triggers a Streamlit Community Cloud redeploy, so the live app picks up fresh prices with
# no manual step.
#
# Schedule is in UTC (GitHub cron ignores DST). US market is 09:30–16:00 ET. We want two runs:
#   • pre-open   — morning, before the 09:30 ET open
#   • pre-close  — ~15 min before the 16:00 ET close
# ET is UTC-4 (summer/EDT) or UTC-5 (winter/EST), so each intent has one cron per season.
#
# GitHub's scheduled trigger is BEST-EFFORT: under load it delays runs by many minutes or drops
# them entirely, with no retry — so a single pre-close cron is unreliable (see the dropped
# 2026-08-26 afternoon run). We therefore fire SEVERAL staggered pre-close crons; the "gate" step
# below passes only the ones that land in the pre-/post-close window (the wrong season's crons land
# outside it and are skipped), and an idempotency check makes every attempt after the first a
# no-op — so we get redundancy against dropped/late deliveries without double refreshes.
on:
  schedule:
    # --- pre-open (morning; the gate accepts any pre-noon ET run, so one is plenty) ---
    - cron: "45 12 * * 1-5"    # ~08:45 ET (EDT) / 07:45 ET (EST) — before the open
    # --- pre-close, EDT/summer: 15:20 / 15:35 / 15:50 ET (staggered redundancy) ---
    - cron: "20,35,50 19 * * 1-5"
    # --- pre-close, EST/winter: 15:20 / 15:35 / 15:50 ET (staggered redundancy) ---
    - cron: "20,35,50 20 * * 1-5"
  # GitHub's own cron is unreliable (it delivered this repo's runs hours late / overnight and
  # missed slots). The RELIABLE path is an EXTERNAL scheduler (e.g. cron-job.org) that POSTs to
  # this workflow's dispatch API at exact times with the `kind` input — a dispatch runs immediately,
  # so timing is precise. The schedule crons above stay as a best-effort fallback.
  workflow_dispatch:
    inputs:
      kind:
        description: "Run label -> RUN_KIND (pre-open refreshes Claude; pre-close refreshes AV)."
        type: choice
        default: manual
        options: [manual, pre-open, pre-close, post-close]

# Never let two refreshes run at once (they both push seed.db).
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write              # needed to commit + push the refreshed seed.db

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 30       # enough history for the gate's "already refreshed today?" check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decide whether to run + label it (DST-aware, around the NYSE close)
        id: gate
        env:
          DISPATCH_KIND: ${{ github.event.inputs.kind }}
        run: |
          python3 - <<'PY'
          import os, datetime, subprocess
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/New_York"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          run, kind = "yes", "manual"
          if event == "workflow_dispatch":
              # An external scheduler (or a manual "Run workflow") sets the label explicitly.
              dk = (os.environ.get("DISPATCH_KIND") or "").strip()
              if dk and dk != "manual":
                  kind = dk                          # 'pre-open' / 'pre-close' / 'post-close'
          elif event == "schedule":
              # DO NOT infer intent from the delivery time. GitHub delivered every cron in this
              # repo 2.5-5 HOURS late through Sep 2026: the 08:45 ET pre-open cron landed at
              # 12:35-13:54 ET and the pre-close crons at 17:33-19:14 ET. Against the old
              # +60/-20-minute window around the close, that skipped 100% of runs from 2026-09-01
              # to 2026-09-18 — silently, because a gated-off job still reports success.
              # So: accept the trigger whenever it arrives inside a sane daily band, label it by
              # which half of the day it lands in, and let the idempotency check below (not the
              # clock) be the thing that prevents a double refresh.
              if now.hour < 15:                      # the morning cron, however late it arrives
                  kind = "pre-open"
              elif now.hour < 23:
                  close = now.replace(hour=16, minute=0, second=0, microsecond=0)
                  kind = "pre-close" if now < close else "post-close"
              else:
                  run = "no"                         # overnight: leave it for tomorrow's pre-open
          # Idempotency (schedule AND dispatch): once a slot has committed seed.db, later attempts
          # for that same slot no-op — so staggered crons, a late delivery and an external trigger
          # firing together never double-refresh.
          #
          # Anchor the look-back to the ET calendar day, NOT to UTC. Past ~20:00 ET the UTC date has
          # already rolled over, so a UTC `replace(hour=...)` names a slot on TOMORROW — a future
          # timestamp that no commit can predate, which silently re-enables every late trigger.
          # Morning slot looks back to 00:00 ET; afternoon slot to 15:00 ET, late enough to sit
          # after even a badly-delayed pre-open run so the afternoon refresh still fires.
          if run == "yes" and event == "schedule":
              anchor = now.replace(hour=(0 if kind == "pre-open" else 15),
                                   minute=0, second=0, microsecond=0)
              since = anchor.astimezone(ZoneInfo("UTC")).strftime("%Y-%m-%dT%H:%M:%S")
              log = subprocess.run(
                  ["git", "log", "--since", since, "--pretty=%H", "--", "data/seed.db"],
                  capture_output=True, text=True).stdout.strip()
              if log:
                  run, kind = "no", "already-refreshed"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={run}\nkind={kind}\n")
          print(f"event={event} ET={now:%Y-%m-%d %H:%M} -> run={run} kind={kind}")
          PY

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Run full pipeline (download prices + rebuild everything)
        if: steps.gate.outputs.run == 'yes'
        env:
          # Trading capital in £ (optional). Set repo variable CAPITAL_GBP to size the daily run
          # against a different budget; unset/blank falls back to the £50,000 default in config.py.
          CAPITAL_GBP: ${{ vars.CAPITAL_GBP }}
          # Optional: set this repo secret to score news with Claude; without it the pipeline
          # falls back to a keyword scan (FinBERT is not installed in CI to keep the run light).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}   # optional; real econ calendar (paid FMP plan)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}  # optional; richer stock news (free tier)
          # Alpha Vantage article-level news sentiment for the day's actionable names. Comma-separate
          # several free keys in the secret to rotate past the 25/day-per-key cap.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          RUN_KIND: ${{ steps.gate.outputs.kind }}  # 'pre-open' / 'pre-close' / 'manual' (shown in-app)
        run: python -m src.pipeline

      - name: Rebuild slim seed.db
        if: steps.gate.outputs.run == 'yes'
        run: python make_seed.py

      - name: Commit & push refreshed seed.db
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seed.db
          if git diff --cached --quiet; then
            echo "No change in seed.db — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled market-data refresh [skip ci]"
          # Rebase-and-retry push. If anything else pushed to main between checkout and now
          # (a code commit, an overlapping manual dispatch), a plain push is rejected as
          # non-fast-forward and the refresh is silently lost. seed.db is the only file we
          # touch, so rebasing onto the latest main is conflict-free.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest origin/main and retrying..."
            git pull --rebase --autostash origin main || true
          done
          echo "::error::Failed to push refreshed seed.db after 5 attempts."
          exit 1

      # A gated-off run still reports SUCCESS, so between 2026-09-01 and 2026-09-18 this workflow
      # went green ~3x a day while committing nothing and the live app served 18-day-old prices.
      # Nothing was failing, so `notify-failure` never fired and no issue was ever opened.
      # This step closes that hole: it runs whatever the gate decided, and fails the job when the
      # committed data has gone stale — which is what actually matters to the app. It runs LAST,
      # so a run that just refreshed successfully sees an age of 0 and passes.
      - name: Fail if the committed data has gone stale
        if: always()
        env:
          MAX_AGE_DAYS: 3
        run: |
          last=$(git log -1 --format=%ct -- data/seed.db || true)
          if [ -z "$last" ]; then
            echo "::error::No commit for data/seed.db in the fetched history (depth 30) —" \
                 "treating as stale. Widen fetch-depth or check the refresh."
            exit 1
          fi
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last data/seed.db commit was ${age} day(s) ago (limit ${MAX_AGE_DAYS})."
          if [ "$age" -ge "$MAX_AGE_DAYS" ]; then
            echo "::error::Market data is ${age} days old. The refresh is not landing —" \
                 "check the gate decision in the 'Decide whether to run' step of recent runs."
            exit 1
          fi

  # If the refresh above failed at any step, the app's data silently goes stale — nobody would
  # know without checking the "as of" timestamp. Open (or bump) a GitHub issue so a missed run
  # is visible. Skips cleanly on the gated no-op afternoon cron (that run succeeds).
  notify-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or bump a "refresh failed" issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="⚠️ Scheduled data refresh failed"
          {
            echo "The twice-daily market-data refresh failed, so the live app's data may be stale"
            echo "until the next successful run. Check the failed run, then re-run it once fixed."
            echo
            echo "Failed run: $RUN_URL"
          } > /tmp/body.md
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Refresh failed again — $RUN_URL"
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi
